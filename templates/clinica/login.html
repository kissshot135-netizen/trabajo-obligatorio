<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Huellas Sanas</title>
    <style>
        body {
            margin: 0;
            background: linear-gradient(135deg, #ecfdf5, #f8fafc);
            font-family: Arial, sans-serif;
            color: #1f2937;
        }
        .container {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 20px;
        }
        .card {
            width: min(420px, 100%);
            background: white;
            border-radius: 20px;
            box-shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
            padding: 30px 24px;
        }
        h1 {
            margin-top: 0;
            margin-bottom: 12px;
            color: #1b4332;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            color: #6b7280;
            margin-bottom: 24px;
        }
        form {
            display: grid;
            gap: 16px;
        }
        .field {
            display: grid;
            gap: 8px;
        }
        label {
            font-weight: 700;
            color: #1b4332;
        }
        .form-control {
            width: 100%;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #d1d5db;
            font-size: 1rem;
        }
        .btn {
            border: none;
            border-radius: 12px;
            background: #2d6a4f;
            color: white;
            padding: 12px 18px;
            font-weight: 700;
            cursor: pointer;
        }
        .errorlist {
            color: #b91c1c;
            list-style: none;
            padding-left: 0;
            margin: 0;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Huellas Sanas</h1>
            <div class="subtitle">Recepción veterinaria</div>
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                    <div class="field">
                        {{ field.label_tag }}
                        {{ field }}
                        {% if field.errors %}
                            <ul class="errorlist">
                                {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
                            </ul>
                        {% endif %}
                    </div>
                {% endfor %}
                <button type="submit" class="btn">Ingresar</button>
            </form>
        </div>
    </div>
</body>
</html>
