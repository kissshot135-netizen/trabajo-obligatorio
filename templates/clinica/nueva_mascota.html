<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo paciente - Huellas Sanas</title>
    <style>
        :root {
            --primary: #2d6a4f;
            --primary-dark: #1b4332;
            --accent: #d4a373;
            --bg: #f4f9f7;
            --card: #ffffff;
            --text: #1f2937;
            --border: #dfe7e2;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #edf8f3, #f8f8f8);
            color: var(--text);
        }
        .container {
            max-width: 820px;
            margin: 50px auto;
            padding: 0 20px;
        }
        .card {
            background: var(--card);
            border-radius: 16px;
            box-shadow: 0 12px 28px rgba(14, 30, 37, 0.12);
            padding: 30px;
        }
        h1 {
            margin-top: 0;
            color: var(--primary-dark);
        }
        form {
            display: grid;
            gap: 18px;
        }
        .field {
            display: grid;
            gap: 8px;
        }
        label {
            font-weight: 700;
            color: var(--primary-dark);
        }
        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-size: 1rem;
        }
        .actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            border: none;
            border-radius: 10px;
            padding: 12px 18px;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
        }
        .btn-secondary {
            background: #e5e7eb;
            color: var(--text);
        }
        @media (max-width: 600px) {
            .card { padding: 20px 16px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Registrar nuevo paciente</h1>
            <form method="post">
                {% csrf_token %}
                {% for field in form %}
                    <div class="field">
                        {{ field.label_tag }}
                        {{ field }}
                        {% if field.errors %}
                            <small style="color: #b91c1c;">{{ field.errors|join:', ' }}</small>
                        {% endif %}
                    </div>
                {% endfor %}
                <div class="actions">
                    <button type="submit" class="btn btn-primary">Guardar paciente</button>
                    <a href="{% url 'agenda_diaria' %}" class="btn btn-secondary">Volver a la agenda</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
