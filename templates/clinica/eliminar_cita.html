<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eliminar cita - Huellas Sanas</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f8fafc; color: #1f2937; }
        .container { max-width: 620px; margin: 100px auto; padding: 0 20px; }
        .card { background: white; border-radius: 18px; box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08); padding: 28px; }
        h1 { color: #1b4332; }
        .actions { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 20px; }
        .btn { display: inline-block; text-decoration: none; border: none; border-radius: 10px; padding: 10px 18px; font-weight: 700; cursor: pointer; }
        .btn-danger { background: #b91c1c; color: white; }
        .btn-secondary { background: #e5e7eb; color: #1f2937; }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h1>Eliminar cita</h1>
            <p>¿Seguro que deseas eliminar la cita de <strong>{{ cita.mascota.nombre }}</strong> para el día <strong>{{ cita.fecha }}</strong> a las <strong>{{ cita.hora }}</strong>?</p>
            <form method="post">
                {% csrf_token %}
                <div class="actions">
                    <button type="submit" class="btn btn-danger">Sí, eliminar</button>
                    <a href="{% url 'agenda_diaria' %}" class="btn btn-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
